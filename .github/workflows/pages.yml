# Tests the game and publishes it on GitHub Pages.
# - on every push and pull request: type-check, tests, build;
# - on a push to main (or by hand): deployment to GitHub Pages.
# Prerequisite (once): Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# one deployment at a time, without cancelling a deployment in progress
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dfrotz (reference interpreter for the fidelity tests)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq frotz
          echo "/usr/games" >> "$GITHUB_PATH"

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
